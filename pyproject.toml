[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hyperliquid-scalping-bot"
version = "1.0.0"
description = "Hyperliquid Scalping Bot — Hyperliquid trading bot for scalping"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["hyperliquid", "hyperliquid trading bot", "scalping bot"]
dependencies = [
  "hyperliquid-python-sdk>=0.8.0",
  "websockets>=12.0",
  "python-dotenv>=1.0.0",
  "pydantic>=2.5.0",
  "numpy>=1.26.0",
  "typer>=0.9.0",
  "rich>=13.7.0",
]

[project.scripts]
hl-bot = "hyperliquid_bot.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
